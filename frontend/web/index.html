<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Genesis Global Church Management System">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis Global CMS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1E3A5F;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      color: #C9A84C;
      font-family: sans-serif;
    }
    #loading h2 { margin-top: 16px; }
  </style>
</head>
<body>
  <div id="loading">
    <h2>Genesis Global CMS</h2>
    <p>Loading...</p>
  </div>
  <script>
    (function () {
      var scriptLoaded = false;

      function loadMainDartJs() {
        if (scriptLoaded) { return; }
        scriptLoaded = true;
        var scriptTag = document.createElement('script');
        scriptTag.src = 'main.dart.js?v=20260704';
        scriptTag.type = 'application/javascript';
        document.body.append(scriptTag);
      }

      async function clearLegacyFlutterServiceWorker() {
        if (!('serviceWorker' in navigator)) { return false; }
        var registrations = await navigator.serviceWorker.getRegistrations();
        if (!registrations.length) { return false; }

        await Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));

        if ('caches' in window) {
          var cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(function (cacheName) {
            return caches.delete(cacheName);
          }));
        }

        if (!sessionStorage.getItem('legacyFlutterServiceWorkerCleared')) {
          sessionStorage.setItem('legacyFlutterServiceWorkerCleared', 'true');
          window.location.reload();
          return true;
        }

        return false;
      }

      window.addEventListener('load', function () {
        clearLegacyFlutterServiceWorker()
          .then(function (reloading) {
            if (!reloading) { loadMainDartJs(); }
          })
          .catch(loadMainDartJs);
      });
    })();
  </script>
</body>
</html>
